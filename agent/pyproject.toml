[project]
name = "iros-agent"
version = "0.1.0"
description = "Institutional Research Operating System - Python backend (FastAPI + LangGraph)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "greenlet>=3.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.29",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-core>=0.3",
    "redis>=5.0",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.26",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "reportlab>=4.2",
    "python-multipart>=0.0.9",
    "yfinance>=0.2",
    "sec-edgar-downloader>=5.1",
    "rank-bm25>=0.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "numpy>=1.26",
    "formulas>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.111",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
